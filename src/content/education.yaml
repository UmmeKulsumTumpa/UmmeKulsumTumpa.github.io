# Newest first. Same institution = one entry with several degrees (connected dots).

- id: iit-du
  org: Institute of Information Technology, University of Dhaka
  short: IIT
  url: https://iit.du.ac.bd
  location: Dhaka
  span: "[YYYY] → now"
  roles:
    - title: M.Sc. in Software Engineering (thesis)
      start: "[YYYY]"
      current: true
      type: "supervised by [Supervisor]"
      details:
        - { label: thesis, value: Adaptive inference for efficient LLMs }
      courses:
        - { name: Research Methodology, note: Systematic review of cross-lingual LLM agents }
        - { name: Software Security, note: Prompt-injection robustness of coding agents }
        - { name: Formal Methods, note: Modelling with Alloy }
      # Thesis progress in % (0-100): the bar on the Home education tile.
      progress: 20
    - title: B.Sc. in Software Engineering
      start: "[YYYY]"
      end: Feb 2026
      type: "CGPA [x.xx] / 4.00"
      details:
        - { label: capstone (SPL-3), value: Voices of Care }
        # {projects} is replaced with the number of entries in course-projects.yaml.
        - { label: course projects, value: "{projects} on GitHub ↓", href: "#course-projects" }

