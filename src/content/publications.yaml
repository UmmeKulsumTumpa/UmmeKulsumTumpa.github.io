  tldr: "A zero-shot LLM pipeline (Qwen-14B, GPT-4o) over 54.5K Reddit posts on Alzheimer's and dementia sorts posts by who is writing, extracts patient details and caregiver motivations, and finds 20 motivation clusters, 7 of them not reported in prior work."
